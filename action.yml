name: ApiProof
description: Detect Stripe breaking changes and report call-site impact
inputs:
  repo:
    description: Repository root relative to the checked-out workspace
    required: false
    default: .
  old-openapi:
    description: Path to the old structured OpenAPI JSON, relative to the workspace
    required: true
  new-openapi:
    description: Path to the new structured OpenAPI JSON, relative to the workspace
    required: true
  old-version:
    description: Label used when the old OpenAPI document has no info.version
    required: true
  new-version:
    description: Label used when the new OpenAPI document has no info.version
    required: true
  impact-output:
    description: Impact JSON output path, relative to the workspace; its parent directory must exist
    required: false
    default: apiproof-impact.json
  report-output:
    description: Markdown evidence report path, relative to the workspace; its parent directory must exist
    required: false
    default: apiproof-evidence.md
  fail-on-changes:
    description: Fail the Action after writing reports when one or more structural changes are found
    required: false
    default: 'true'
runs:
  using: docker
  image: Dockerfile
  args:
    - scan
    - --repo
    - /github/workspace/${{ inputs.repo }}
    - --old
    - /github/workspace/${{ inputs.old-openapi }}
    - --new
    - /github/workspace/${{ inputs.new-openapi }}
    - --old-version
    - ${{ inputs.old-version }}
    - --new-version
    - ${{ inputs.new-version }}
    - --json
    - /github/workspace/${{ inputs.impact-output }}
    - --markdown
    - /github/workspace/${{ inputs.report-output }}
    - --fail-on-changes
    - ${{ inputs.fail-on-changes }}
branding:
  icon: shield
  color: purple
