name: Bug report
description: Report a reproducible problem with the CLI, Action, or site.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Do not include live Stripe keys, tokens, customer data,
        private OpenAPI files, or generated reports. Redact anything sensitive.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project is affected?
      options:
        - CLI
        - GitHub Action
        - Site
        - Documentation
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: State the boundary or command behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use the smallest local example you can share safely.
      render: shell
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "20.11.1"
  - type: input
    id: dokimana-version
    attributes:
      label: Dokimana version or commit
      placeholder: "0.1.0 or a commit SHA"
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste only redacted terminal or report output.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed secrets, live keys, and private data from this report.
          required: true
        - label: I searched existing issues and did not find a duplicate.
          required: true
