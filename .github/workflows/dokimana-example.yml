name: Dokimana

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan Stripe API changes
        uses: ./
        with:
          repo: .
          old-openapi: fixtures/stripe-old.json
          new-openapi: fixtures/stripe-new.json
          old-version: fixture-old
          new-version: fixture-new
          impact-output: dokimana-impact.json
          report-output: dokimana-evidence.md
          fail-on-changes: false
      - name: Upload impact report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dokimana-evidence
          path: |
            dokimana-impact.json
            dokimana-evidence.md
          if-no-files-found: error
          retention-days: 7
