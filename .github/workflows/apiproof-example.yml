name: ApiProof

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm run dev -- scan --repo . --old fixtures/stripe-old.json --new fixtures/stripe-new.json --old-version old --new-version new --json impact.json
