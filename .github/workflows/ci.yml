name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - name: Check circular dependencies
        run: npm run check:cycles
      - name: Check unused exports
        run: npm run check:dead-code
      - run: npm run format:check
      - run: npm run perf:check
      - name: Install pinned oasdiff
        run: |
          set -euo pipefail
          url='https://github.com/oasdiff/oasdiff/releases/download/v1.41.0/oasdiff_1.41.0_linux_amd64.tar.gz'
          expected='96365453163118e6503eb71742643d9ee67f91aedbaadd1a1ce9c6213e3b71c7'
          curl -fsSL "$url" -o "$RUNNER_TEMP/oasdiff.tar.gz"
          echo "$expected  $RUNNER_TEMP/oasdiff.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/oasdiff"
      - name: Check oasdiff divergence corpus
        run: |
          set -euo pipefail
          npm run oasdiff:corpus -- --oasdiff "$RUNNER_TEMP/oasdiff"
          git diff --exit-code -- docs/DIVERGENCES.md
