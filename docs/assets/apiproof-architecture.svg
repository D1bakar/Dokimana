<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">ApiProof architecture</title>
  <desc id="description">The CLI coordinates a structured diff, TypeScript and JavaScript AST scanner, constrained fix proposal module, verifier with a key-safety guard and unconfigured runner, and JSON and Markdown reporting. Provider fetching and container execution are ports, not active integrations.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#62748a"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #182431; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; fill: #54677b; }
      .heading { font-size: 17px; font-weight: 700; }
      .body { font-size: 13px; fill: #435367; }
      .box { fill: #fff; stroke: #ccd6e0; stroke-width: 1.5; }
      .active { fill: #eef7f6; stroke: #148276; }
      .port { fill: #f3f5f7; stroke: #a7b2bf; stroke-dasharray: 6 5; }
      .flow { fill: none; stroke: #62748a; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1200" height="430" rx="18" fill="#f7f9fb"/>
  <text x="40" y="44" class="eyebrow">SMALL MODULES · EXPLICIT BOUNDARIES · NO HIDDEN EXECUTION</text>

  <rect x="40" y="85" width="170" height="82" rx="12" class="box active"/>
  <text x="60" y="118" class="heading">CLI</text>
  <text x="60" y="143" class="body">scan · verify · report · doctor</text>

  <path d="M210 126h34" class="flow"/>
  <rect x="255" y="85" width="215" height="82" rx="12" class="box active"/>
  <text x="275" y="118" class="heading">Diff + scanner</text>
  <text x="275" y="143" class="body">Structured JSON + ts-morph</text>

  <path d="M470 126h34" class="flow"/>
  <rect x="515" y="85" width="205" height="82" rx="12" class="box active"/>
  <text x="535" y="118" class="heading">Evidence report</text>
  <text x="535" y="143" class="body">Terminal · JSON · Markdown</text>

  <rect x="770" y="85" width="190" height="82" rx="12" class="box"/>
  <text x="790" y="118" class="heading">Fix proposals</text>
  <text x="790" y="143" class="body">Explicit mappings only</text>
  <path d="M470 172c65 48 235 48 300 0" fill="none" stroke="#62748a" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>

  <rect x="990" y="85" width="170" height="82" rx="12" class="box active"/>
  <text x="1010" y="118" class="heading">Key guard</text>
  <text x="1010" y="143" class="body">Reject unsafe keys</text>

  <path d="M1075 167v45" class="flow"/>
  <rect x="770" y="222" width="390" height="82" rx="12" class="box port"/>
  <text x="790" y="255" class="heading">ContainerExecutionPort · stubbed</text>
  <text x="790" y="280" class="body">DockerNotConfiguredRunner returns could_not_run; executes nothing.</text>

  <rect x="40" y="222" width="315" height="82" rx="12" class="box port"/>
  <text x="60" y="255" class="heading">ProviderFetcher · interface only</text>
  <text x="60" y="280" class="body">Inputs are currently supplied as local files.</text>

  <rect x="40" y="345" width="1120" height="48" rx="10" fill="#eaf0f5"/>
  <text x="60" y="375" class="body">Dashed boxes and connectors indicate boundaries that are modeled but not implemented as active integrations.</text>
</svg>
